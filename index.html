<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c2704e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WurxOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WurxOS" />
    <title>WurxOS</title>

    <!-- Modern UI fonts — curated Google Fonts set. Preconnect saves
         ~100ms on the first font fetch. All requested via one combined
         query for HTTP/2 multiplexing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />

    <script>
      // Apply theme + font preferences before paint so there's no flash.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('wurxos-theme') || 'dark';
          root.setAttribute('data-theme', t);
        } catch (e) { root.setAttribute('data-theme', 'dark'); }
        try {
          var f = localStorage.getItem('wurxos-font-family');
          if (f) root.setAttribute('data-font-family', f);
        } catch (e) {}
        try {
          var s = localStorage.getItem('wurxos-font-size');
          if (s) root.setAttribute('data-font-size', s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
