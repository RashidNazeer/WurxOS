<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Logo.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c2704e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WurxOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WurxOS" />
    <meta name="author" content="Wurx Media" />
    <meta name="description" content="WurxOS — WurxCrew operations platform by Wurx Media. Brands, attendance, incentives, performance." />

    <!-- Open Graph / Twitter — what shows when the wurxos.vercel.app
         link is dropped into Slack, WhatsApp, etc. -->
    <meta property="og:title" content="WurxOS · Wurx Media" />
    <meta property="og:description" content="WurxCrew operations platform — brands, attendance, incentives, performance." />
    <meta property="og:image" content="/Logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WurxOS" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WurxOS · Wurx Media" />
    <meta name="twitter:description" content="WurxCrew operations platform — brands, attendance, incentives, performance." />
    <meta name="twitter:image" content="/Logo.png" />

    <title>WurxOS · Wurx Media</title>

    <!-- Modern UI fonts — curated Google Fonts set. Preconnect saves
         ~100ms on the first font fetch. Loaded NON-render-blocking (preload →
         stylesheet onload) so the font CSS never delays first paint; display=swap
         means text shows immediately in the system fallback and swaps in when the
         chosen family arrives. <noscript> keeps it working with JS disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>

    <script>
      // Apply theme + font preferences before paint so there's no flash.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('wurxos-theme') || 'dark';
          root.setAttribute('data-theme', t);
        } catch (e) { root.setAttribute('data-theme', 'dark'); }
        try {
          var f = localStorage.getItem('wurxos-font-family');
          if (f) root.setAttribute('data-font-family', f);
        } catch (e) {}
        try {
          var s = localStorage.getItem('wurxos-font-size');
          if (s) root.setAttribute('data-font-size', s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
